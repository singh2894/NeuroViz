[project]
name = "neuroviz"
version = "0.1.0"
description = "NeuroViz: NLP-Powered Visualization Assistant"
authors = [
    {name = "Simran"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "polars (>=1.35.2,<2.0.0)",
    "altair (>=5.5.0,<6.0.0)",
    "streamlit (>=1.51.0,<2.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "fastexcel (>=0.12.0,<1.0.0)",
    "scikit-learn (>=1.7.0,<2.0.0)",
    "vl-convert-python (>=1.6.0,<2.0.0)"
]

[project.optional-dependencies]
boosters = [
    "xgboost (>=2.0.0,<4.0.0)",
    "lightgbm (>=4.0.0,<5.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Vendored Automated Insight Engine keeps its upstream style
"app/aie/*" = ["E501", "B905", "E731"]
"tests/test_aie_*" = ["E501", "B905"]

[tool.black]
line-length = 88
target-version = ["py313"]

[dependency-groups]
dev = [
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "ruff (>=0.14.4,<0.15.0)",
    "pre-commit (>=4.4.0,<5.0.0)",
]
